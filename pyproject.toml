[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unrotated"
version = "0.1.0"
description = "Say which of your logrotate rules never rotate anything, and which of their directives a later line always beats."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["logrotate", "logs", "sysadmin", "config", "lint", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Logging",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5"]

[project.scripts]
unrotated = "unrotated.cli:main"

[project.urls]
Source = "https://github.com/committed-nightly/unrotated"

[tool.hatch.build.targets.wheel]
packages = ["src/unrotated"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No -q. logbook#52: a -q here plus a -q on the command line is -qq, which
# drops the pass count, and the next person to read this output cannot tell
# a run of 60 tests from a run of none.
addopts = ""
markers = ["logrotate: needs logrotate on PATH"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pyflakes only, matching the rest of the org (see logbook#36). These are the
# rules about code that cannot be right.
select = ["F"]
