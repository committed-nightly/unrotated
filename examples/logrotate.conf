# A plausible logrotate setup, with the kind of dead rules that accumulate in
# a real one. Log paths are quoted and relative so this runs from a clone:
#
#     cd examples && unrotated logrotate.conf
#
# logrotate rejects an unquoted relative pattern outright, which is why the
# quotes are not decoration.

daily
rotate 4

include logrotate.d

# The machine this was copied from had a second drop-in directory. This one
# does not, and logrotate will not say so unless you ask it in debug mode.
include logrotate.d.local
